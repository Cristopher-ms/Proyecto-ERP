name: ERP Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    name: Build & Test Backend (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas unitarias con Maven
        working-directory: backend/inventory-service
        run: mvn clean test

  build-frontend:
    name: Build Frontend (Angular 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/erp-web/package.json

      - name: Instalar dependencias
        working-directory: frontend/erp-web
        run: npm install

      - name: Compilar producción de Angular
        working-directory: frontend/erp-web
        run: npm run build
