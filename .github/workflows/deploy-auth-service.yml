name: Build & Push Auth Service to ACR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/auth-service/**'
      - '.github/workflows/deploy-auth-service.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image (auth-service)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: acrerpcristopher.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen de auth-service
        uses: docker/build-push-action@v5
        with:
          context: backend/auth-service
          push: true
          tags: |
            acrerpcristopher.azurecr.io/auth-service:latest
            acrerpcristopher.azurecr.io/auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
