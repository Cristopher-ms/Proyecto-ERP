name: Build & Push API Gateway to ACR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/api-gateway/**'
      - '.github/workflows/deploy-api-gateway.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image (api-gateway)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: acrerpcristopher.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen de api-gateway
        uses: docker/build-push-action@v5
        with:
          context: backend/api-gateway
          push: true
          tags: |
            acrerpcristopher.azurecr.io/api-gateway:latest
            acrerpcristopher.azurecr.io/api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
