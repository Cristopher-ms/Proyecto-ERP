server:
  port: 8083
  servlet:
    context-path: /

spring:
  application:
    name: orders-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/erp_orders_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:erp_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:erp_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_ENABLED:false}
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Configuración del Broker de Eventos de Órdenes
erp:
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
    exchange: erp.order.exchange
    queue: erp.inventory.order-created.queue
    routing-key: order.created

# Documentación OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Métricas y Sondas de Salud con Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
