server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: inventory-service
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Documentación Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Métricas y Salud con Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
