server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: auth-service
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Configuración JWT (Firma HMAC SHA-256)
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000        # 24 horas para tokens de acceso
  refresh-expiration-ms: 604800000 # 7 días para refresh token

# Documentación OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Métricas y Sondas de Salud con Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
