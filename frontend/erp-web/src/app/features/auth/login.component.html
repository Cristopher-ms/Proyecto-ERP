<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="login-title">ERP Cloud Enterprise</h1>
      <p class="login-subtitle">Control de Acceso, Autenticación JWT y Roles RBAC</p>
      <div class="phase-tag">Fase 2: Spring Security 6 + API Gateway</div>
    </div>

    <div *ngIf="errorMessage" class="alert-error">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label">Correo Electrónico Corporativo</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="form.email"
            name="email"
            placeholder="admin@erp.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="form.password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Ingresar al Sistema</span>
        <span *ngIf="isLoading" class="spinner-container">
          <span class="spinner"></span> Validando credenciales...
        </span>
      </button>
    </form>

    <!-- Sección de demostración rápida para reclutadores -->
    <div class="demo-section">
      <div class="demo-title">
        <span>Perfiles de Demostración Rápida</span>
      </div>
      <p class="demo-hint">Haz clic en un perfil para auto-completar las credenciales:</p>
      <div class="demo-buttons">
        <button type="button" class="btn-demo demo-admin" (click)="fillCredentials('admin')">
          <span class="demo-role">ADMIN</span>
          <span class="demo-email">admin&#64;erp.com</span>
        </button>
        <button type="button" class="btn-demo demo-vendedor" (click)="fillCredentials('vendedor')">
          <span class="demo-role">VENDEDOR</span>
          <span class="demo-email">vendedor&#64;erp.com</span>
        </button>
        <button type="button" class="btn-demo demo-almacen" (click)="fillCredentials('almacen')">
          <span class="demo-role">ALMACÉN</span>
          <span class="demo-email">almacen&#64;erp.com</span>
        </button>
      </div>
    </div>
  </div>
</div>
